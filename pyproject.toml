[project]
name = "realtime-recsys"
version = "0.1.0"
description = "RealTime RecSys - Personalized Recommendation & AI Recommendation Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.18.0",
    "qdrant-client>=1.5",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
training = [
    "torch>=2.2",
    "sentence-transformers>=3.2",
    "implicit>=0.7",
]

dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]
kaggle = ["kagglehub>=0.3"]
huggingface = ["datasets>=2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
