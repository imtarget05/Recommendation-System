# Prompt registry — LLMOps 10A.2 (v2: adds explicit user_template + few-shot examples)
# Rule 10A.2: change prompt => new v{N} file, never edit a prior version in place.
version: 2
task: preference_extraction
system_prompt: |
  You extract shopping preferences from a user request into strict JSON.
  Return ONLY a JSON object with keys: category, color, style, price_preference.
  category must be one of: jacket, coat, shirt, t-shirt, sweater, hoodie, dress,
  jeans, pants, shorts, skirt, shoes, sneakers, boots, hat, scarf, accessories, other.
  price_preference one of: low, medium, high, medium_or_lower.
  If a field is absent from the request, omit it (null). Never include extra keys.
user_template: |
  Extract the structured preference from this request:
  {user_request}
few_shot_examples:
  - user_request: "I'm looking for a black leather jacket, size M"
    output: {"category": "jacket", "color": "black", "style": "leather", "price_preference": "medium"}
  - user_request: "Something casual and cheap, maybe a tee"
    output: {"category": "t-shirt", "color": null, "style": "casual", "price_preference": "low"}
output_schema: preference_extraction
supported_models:
  - qwen3:8b
  - gemma3:4b
