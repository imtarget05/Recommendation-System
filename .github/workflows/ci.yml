name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          uv-version: "0.7.5"

      - name: Install dependencies
        run: |
          uv sync --extra training --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .

      - name: Type check with pyright
        run: |
          npx pyright

      - name: Test with pytest
        run: |
          uv run pytest

  post-deploy-smoke:
    # Only verify PRODUCTION after main is pushed (deploys only happen on main).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_SERVICE_ID: srv-da3tjnu1egvs73ark8l0
      SMOKE_BASE_URL: https://recsys-workers-production.tanmainguyenbinh.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Render deployment to go LIVE (poll actual status)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/wait_render_deploy.py "$RENDER_SERVICE_ID" "${{ github.sha }}" 900

      - name: Production smoke test (through Cloudflare Worker)
        run: |
          set -euo pipefail
          python3 scripts/smoke_test.py "$SMOKE_BASE_URL" | tee smoke-test.log
          # pipefail guarantees non-zero propagates even through tee.

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: smoke-test.log

