name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          uv-version: "0.7.5"

      - name: Install dependencies
        run: |
          uv sync --extra training --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .

      - name: Type check with pyright
        run: |
          npx pyright

      - name: Test with pytest
        run: |
          uv run pytest

  post-deploy-smoke:
    # Only verify PRODUCTION after main is pushed (deploys only happen on main).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_SERVICE_ID: srv-da3tjnu1egvs73ark8l0
      SMOKE_BASE_URL: https://recsys-workers-production.tanmainguyenbinh.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Render deployment to go LIVE (poll actual status)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Waiting for deploy of commit ${SHA:0:7} to be live..."
          for i in $(seq 1 60); do
            RESP=$(curl -s -m 15 \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=5" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")
            STATUS=$(echo "$RESP" | python3 -c "
          import json,sys
          deploys = json.load(sys.stdin)
          for d in deploys:
              d = d['deploy']
              if d.get('commit', {}).get('id','').startswith('${SHA:0:7}'):
                  print(d['status']['name']); break
          else:
                  print('not_found')
          " || echo "parse_error")
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              live) echo "Deployment LIVE"; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                echo "Deployment FAILED: $STATUS"; exit 1 ;;
              not_found)
                echo "Deploy for this commit not registered yet; Render may auto-deploy shortly" ;;
            esac
            sleep 15
          done
          echo "TIMEOUT waiting for deployment"; exit 1

      - name: Production smoke test (through Cloudflare Worker)
        run: |
          set -euo pipefail
          python3 scripts/smoke_test.py "$SMOKE_BASE_URL" | tee smoke-test.log
          # pipefail guarantees non-zero propagates even through tee.

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: smoke-test.log

